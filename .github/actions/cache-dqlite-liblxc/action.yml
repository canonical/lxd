name: Cache dqlite/liblxc dependencies
description: Restore dqlite/liblxc from the daily cache or build them

inputs:
  export-env:
    description: |
      Whether to export the CGO build variables (CGO_CFLAGS, CGO_LDFLAGS,
      CGO_LDFLAGS_ALLOW, LD_LIBRARY_PATH, LD_RUN_PATH, PKG_CONFIG_PATH) to GITHUB_ENV
      so LXD can be built against the dependencies.
      Leave disabled for jobs that only run prebuilt binaries (e.g. system/snap tests).
    default: "false"
    required: false

runs:
  using: composite
  steps:
    - name: deps cache key
      id: deps-cache-key
      shell: bash
      run: |
        set -eux
        . /etc/os-release
        ARCH="$(dpkg --print-architecture)"
        DATE="$(date --utc '+%Y%m%d')"
        YESTERDAY="$(date --utc '+%Y%m%d' --date=yesterday)"

        # dqlite/liblxc deps cache key
        eval "$(grep -E '^(DQLITE|LIBLXC)_BRANCH=' Makefile)"

        # i.e: deps-ubuntu-24.04-amd64-dqlite-main-liblxc-main-${DATE}
        KEY_PREFIX="deps-${ID}-${VERSION_ID}-${ARCH}-dqlite-${DQLITE_BRANCH}-liblxc-${LIBLXC_BRANCH}"
        echo "KEY=${KEY_PREFIX}-${DATE}" >> $GITHUB_OUTPUT
        echo "FALLBACK_KEY=${KEY_PREFIX}-${YESTERDAY}" >> $GITHUB_OUTPUT

    # GitHub will remove any cache entries that have not been accessed in over 7 days.
    # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows#usage-limits-and-eviction-policy
    # Restoring the cache is safe even from untrusted forks
    - name: Restore dqlite/liblxc deps
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-deps
      with:
        path: |
          /home/runner/go/deps/dqlite
          /home/runner/go/deps/liblxc
        key: ${{ steps.deps-cache-key.outputs.KEY }}
        restore-keys: |
          ${{ steps.deps-cache-key.outputs.FALLBACK_KEY }}

    - name: Check if deps need building
      id: check-build
      if: ${{ steps.cache-deps.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        # When a restore-key fallback is used, cache-hit is false even though the
        # directories were restored. Check that the compiled libraries exist to
        # avoid a needless build.
        if [ -f /home/runner/go/deps/dqlite/.libs/libdqlite.so ] && \
           [ -n "$(find /home/runner/go/deps/liblxc/lib -name liblxc.so 2>/dev/null)" ]; then
          echo "==> SKIP building as dqlite and liblxc deps were restored from fallback key"
          echo "needed=false" >> "$GITHUB_OUTPUT"
        else
          echo "needed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install LXD build dependencies
      if: ${{ steps.check-build.outputs.needed == 'true' }}
      uses: $/.github/actions/install-lxd-builddeps

    - name: Build LXD dependencies
      if: ${{ steps.check-build.outputs.needed == 'true' }}
      shell: bash
      run: |
        set -eux

        # Build dqlite/liblxc in place.
        cd "${GITHUB_WORKSPACE}"
        make deps

    # Only save if deps were actually built (not restored), AND the code is running on the main repo (not an untrusted fork)
    - name: Save dqlite/liblxc deps
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: |
        steps.check-build.outputs.needed == 'true' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      with:
        path: |
          /home/runner/go/deps/dqlite
          /home/runner/go/deps/liblxc
        key: ${{ steps.deps-cache-key.outputs.KEY }}

    # Export the build environment after dependencies are available, on cache hits
    # and misses, and only when the caller opts in via export-env.
    - name: Update env variables for deps
      if: ${{ inputs.export-env == 'true' }}
      shell: bash
      run: | # zizmor: ignore[github-env]
        set -eux

        eval "$(make -s env)"
        export LD_RUN_PATH="${LD_LIBRARY_PATH}" # Ensure linked binaries can find the libraries at runtime
        for variable in CGO_CFLAGS CGO_LDFLAGS CGO_LDFLAGS_ALLOW LD_LIBRARY_PATH PKG_CONFIG_PATH LD_RUN_PATH; do
          value="${!variable}"
          printf '%s=%s\n' "${variable}" "${value}" >> "${GITHUB_ENV}"
        done
