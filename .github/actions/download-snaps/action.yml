name: Download snap dependencies
description: Download snaps and their assertion files for "offline" installation and cache them for the day

inputs:
  prime-cache-only:
    description: 'Set to true to only populate cache on miss without restoring files. When false (default), cache will be restored if available.'
    default: "false"
    required: false
  snap-cache-dir:
    description: Where to save the snap dependencies
    required: true
  snapd-channel:
    description: snapd snap channel to seed the cache with
    default: "latest/beta"
    required: false
  core26-channel:
    description: core26 snap channel to seed the cache with
    default: "latest/candidate"
    required: false
  core24-channel:
    description: core24 snap channel to seed the cache with
    default: "latest/candidate"
    required: false
  core22-channel:
    description: core22 snap channel to seed the cache with
    default: "latest/candidate"
    required: false
  lxd-lts-channel:
    description: LXD LTS snap channel to seed the cache with
    default: "5.21/edge"
    required: false
  lxd-channel:
    description: LXD snap channel to seed the cache with
    default: "latest/edge"
    required: false
  microceph-channel:
    description: MicroCeph snap channel to seed the cache with
    # XXX: avoid Ceph 20.2.4 due to new authentication for CVE-2025-30156 not compatible with the ceph-common version shipped in the LXD snap
    # Revert to latest/edge once https://bugs.launchpad.net/ubuntu/+source/ceph/+bug/2166817 is fixed and propagated in the LXD snap
    default: "tentacle/stable"
    required: false
  microovn-channel:
    description: MicroOVN snap channel to seed the cache with
    default: "latest/edge"
    required: false

runs:
  using: composite
  steps:
    - name: snaps cache key
      id: snaps-cache-key
      shell: bash
      run: |
        set -eux
        ARCH="$(dpkg --print-architecture)"
        DATE="$(date --utc '+%Y%m%d')"
        YESTERDAY="$(date --utc '+%Y%m%d' --date=yesterday)"

        # i.e: snaps-amd64-${DATE}
        echo "KEY=snaps-${ARCH}-${DATE}" >> $GITHUB_OUTPUT
        echo "FALLBACK_KEY=snaps-${ARCH}-${YESTERDAY}" >> $GITHUB_OUTPUT

    # GitHub will remove any cache entries that have not been accessed in over 7 days.
    # https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/caching-dependencies-to-speed-up-workflows#usage-limits-and-eviction-policy
    # Restoring the cache is safe even from untrusted forks
    - name: Restore snaps cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-snaps
      with:
        path: ${{ inputs.snap-cache-dir }}
        key: ${{ steps.snaps-cache-key.outputs.KEY }}
        restore-keys: |
          ${{ steps.snaps-cache-key.outputs.FALLBACK_KEY }}
        lookup-only: ${{ inputs.prime-cache-only == 'true' }}

    - name: Download snaps
      if: ${{ steps.cache-snaps.outputs.cache-hit != 'true' }}
      env:
        SNAP_CACHE_DIR: ${{ inputs.snap-cache-dir }}
        INPUTS_SNAPD_CHANNEL: ${{ inputs.snapd-channel }}
        INPUTS_CORE26_CHANNEL: ${{ inputs.core26-channel }}
        INPUTS_CORE24_CHANNEL: ${{ inputs.core24-channel }}
        INPUTS_CORE22_CHANNEL: ${{ inputs.core22-channel }}
        INPUTS_LXD_LTS_CHANNEL: ${{ inputs.lxd-lts-channel }}
        INPUTS_LXD_CHANNEL: ${{ inputs.lxd-channel }}
        INPUTS_MICROCEPH_CHANNEL: ${{ inputs.microceph-channel }}
        INPUTS_MICROOVN_CHANNEL: ${{ inputs.microovn-channel }}
      shell: bash
      run: |
        set -eux

        # It's possible to get here despite doing a cache-hit because when one
        # of the restore-keys is used as fallback, the outputs.cache-hit is set
        # to false. As such, check if the directory is present and if so,
        # bail out early.
        if [ -n "$(ls -A "${SNAP_CACHE_DIR}")" ]; then
          echo "==> SKIP downloading snaps as they were restored from fallback key"
          exit 0
        fi

        # XXX: it doesn't matter that `xdelta3` is not installed as no delta
        # can be used as we start without any snaps

        . test/includes/snap.sh

        # Seed the snap dependencies cache
        download_snap snapd "${INPUTS_SNAPD_CHANNEL}"
        download_snap core26 "${INPUTS_CORE26_CHANNEL}"
        download_snap core24 "${INPUTS_CORE24_CHANNEL}"
        download_snap core22 "${INPUTS_CORE22_CHANNEL}"
        download_snap lxd "${INPUTS_LXD_LTS_CHANNEL}"
        download_snap lxd "${INPUTS_LXD_CHANNEL}"
        download_snap microceph "${INPUTS_MICROCEPH_CHANNEL}"
        download_snap microovn "${INPUTS_MICROOVN_CHANNEL}"

    # Only save if there wasn't an exact cache hit, AND the code is running on the main repo (not an untrusted fork)
    - name: Save snaps cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: |
        steps.cache-snaps.outputs.cache-hit != 'true' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      with:
        path: ${{ inputs.snap-cache-dir }}
        key: ${{ steps.snaps-cache-key.outputs.KEY }}
