name: Assign domain reviewers

on:
  # dangerous-triggers does not apply: no PR code is checked out or executed. The only
  # checkout is .github/domain-owners.json from the default branch. Write permission is
  # needed to request reviewers on fork PRs.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - labeled
      - unlabeled
      - ready_for_review
  # Called by triage.yml after the labeler has run.
  workflow_call:

permissions: {}

jobs:
  assign-reviewers:
    if: ${{ github.repository == 'canonical/lxd' && !github.event.pull_request.draft }}
    permissions:
      pull-requests: write
    name: Assign domain reviewers
    runs-on: ubuntu-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Always check out the repositories default branch.
          # This is also important on non-default branches which might not have the domain owners file.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/domain-owners.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Sync domain reviewers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          # Abort immediately on any error, unset variable, or failed pipeline stage.
          set -euo pipefail

          # Skip the whole job if the domain owners file is missing or empty.
          if ! [ -s ".github/domain-owners.json" ]; then
            echo "::warning::Missing .github/domain-owners.json file."
            exit 0
          fi

          # Fetch current PR labels.
          mapfile -t PR_LABELS < <(gh pr view "${PR_NUMBER}" --repo "${REPO}" \
            --json labels --jq '.labels[].name')

          # Build the desired reviewer set: union of owners for every domain
          # label currently on the PR, excluding the PR author, deduplicated.
          declare -A desired
          for pr_label in "${PR_LABELS[@]}"; do
            # Look up the owners configured for this label in domain-owners.json.
            while IFS= read -r owner; do
              if [[ -n "${owner}" && "${owner}" != "${PR_AUTHOR}" ]]; then
                desired["${owner}"]=1
              fi
            done < <(jq -r \
              --arg label "${pr_label}" \
              '.domains[] | select(.label == $label) | .owners[]' \
              .github/domain-owners.json)
          done

          # Fetch current requested reviewers and existing reviews on the PR.
          mapfile -t CURRENT_REVIEWERS < <(gh pr view "${PR_NUMBER}" --repo "${REPO}" \
            --json reviewRequests --jq '.reviewRequests[].login')
          mapfile -t REVIEWED < <(gh pr view "${PR_NUMBER}" --repo "${REPO}" \
            --json reviews --jq '.reviews[].author.login')

          # If a reviewer has already been requested or has already reviewed
          # (e.g. assigned manually by the PR author), do not add another one.
          if [[ ${#CURRENT_REVIEWERS[@]} -gt 0 || ${#REVIEWED[@]} -gt 0 ]]; then
            echo "A reviewer is already assigned; not requesting another one."
            exit 0
          fi

          # No candidate reviewers are available for the current labels.
          if [[ ${#desired[@]} -eq 0 ]]; then
            echo "No domain reviewers match the current labels."
            exit 0
          fi

          # Pick a single reviewer at random from the desired set.
          mapfile -t CANDIDATES < <(printf '%s\n' "${!desired[@]}")
          REVIEWER="${CANDIDATES[RANDOM % ${#CANDIDATES[@]}]}"

          # Request a review from the chosen reviewer only.
          echo "Adding reviewer: ${REVIEWER}"
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" \
            --add-reviewer "${REVIEWER}"
