name: Snap channel tests

on:
  # Scheduled workflows only run from the default branch so the scheduled runs of this
  # workflow are dispatched from the copy of `snap.yml` on `main`.
  workflow_dispatch:
    inputs:
      snap-risk:
        description: Snap risk level, `edge`, `candidate` or `stable`.
        type: choice
        default: 'edge'
        options:
          - 'edge'
          - 'candidate'
          - 'stable'
      ubuntu-releases:
        description: Ubuntu releases to run the tests against. In JSON format, i.e. '["22.04", "26.04"]'.
        type: choice
        default: '["22.04", "24.04", "26.04"]'
        options:
          - '["22.04"]'
          - '["24.04"]'
          - '["26.04"]'
          - '["24.04", "26.04"]'
          - '["22.04", "24.04", "26.04"]'
      tmate-debug:
        description: Use tmate debugging session on integration test failure.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.snap-risk }}-${{ inputs.ubuntu-releases }}
  # XXX: runs dispatched from the schedule on `main` should not cancel manually triggered ones
  cancel-in-progress: false

defaults:
  run:
    # Make sure bash is always invoked with `-eo pipefail`
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell
    shell: bash

env:
  IMAGE_CACHE_DIR: "/home/runner/image-cache"
  SNAP_CACHE_DIR: "/home/runner/snap-cache"
  # XXX: avoid Ceph 20.2.4 due to new authentication for CVE-2025-30156 not compatible with the ceph-common version shipped in the LXD snap
  # Revert to latest/edge once https://bugs.launchpad.net/ubuntu/+source/ceph/+bug/2166817 is fixed and propagated in the LXD snap
  MICROCEPH_SNAP_CHANNEL: "tentacle/stable"
  # Only seed the snaps cache with the bases needed by this branch: core24 for LXD 5.21, MicroCeph and MicroOVN 24.03.
  # core26 is for MicroCeph latest/edge, once the `tentacle/stable` workaround above is reverted.
  SNAP_CORES: "core24 core26"
  MICROOVN_SNAP_CHANNEL: "24.03/edge"
  MICROOVN_SNAP_CORE: "core24"

jobs:
  # Prime the images/snaps caches once so the (potentially large) snap-tests
  # matrix below doesn't stampede on cache misses.
  prime-caches:
    name: Prime caches
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prime cache with external test images
        uses: $/.github/actions/download-images
        with:
          prime-cache-only: true
          image-cache-dir: ${{ env.IMAGE_CACHE_DIR }}

      - name: Prime cache with snap dependencies
        uses: $/.github/actions/download-snaps
        with:
          prime-cache-only: true
          snap-cache-dir: ${{ env.SNAP_CACHE_DIR }}
          cache-key-suffix: ${{ github.run_id }}
          cores: ${{ env.SNAP_CORES }}
          lxd-channel: 5.21/${{ inputs.snap-risk || 'edge' }}
          microceph-channel: ${{ env.MICROCEPH_SNAP_CHANNEL }}
          microovn-channel: ${{ env.MICROOVN_SNAP_CHANNEL }}

  snap-tests:
    needs: prime-caches
    name: ${{ matrix.test }} (5.21/${{ matrix.risk }} - ${{ matrix.os }})
    runs-on: ubuntu-${{ matrix.os }}
    # avoid runaway test burning 6 hours of CI
    timeout-minutes: 60
    permissions:
      actions: write  # to save caches (only runs from the canonical repo, not fork PRs)
      contents: read  # for private repos or higher API rate limits
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.ubuntu-releases || '["22.04", "24.04", "26.04"]') }}
        risk:
          - ${{ inputs.snap-risk || 'edge' }}
        test:
          - bgp
          - cgroup
          - cloud-init
          - cluster
          - container
          - container-copy
          - conversion
          - cpu-vm
          - devlxd
          - docker
          - efi-vm
          - lxd-consumers
          - lxd-user
          - interception
          - nesting
          - network-bridge-firewall
          - network-ovn ovn:deb
          - network-ovn ovn:24.03/edge
          - network-routed
          - snapd
          - storage-buckets
          - storage-disks-vm
          - storage-metadata
          - storage-vm btrfs
          - storage-vm ceph
          - storage-vm dir
          - storage-vm lvm
          - storage-vm lvm-thin
          - storage-vm zfs
          - storage-volumes-vm
          - tpm-vm
          - ui chromium
          - ui firefox
          - vm
          - vm-migration
        exclude:
          # bgp and conversion are not worth testing on 22.04
          - os: 22.04
            test: bgp
          - os: 22.04
            test: conversion

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tune disk performance
        uses: $/.github/actions/tune-disk-performance

      - name: Reclaim some memory
        uses: $/.github/actions/reclaim-memory

      - name: Remove docker
        uses: $/.github/actions/disable-docker

      - name: ${{ matrix.test }}
        uses: $/.github/actions/snap-test
        with:
          test: ${{ matrix.test }}
          channel: 5.21/${{ matrix.risk }}
          os: ${{ matrix.os }}
          image-cache-dir: ${{ env.IMAGE_CACHE_DIR }}
          snap-cache-dir: ${{ env.SNAP_CACHE_DIR }}
          snap-cache-key-suffix: ${{ github.run_id }}
          cores: ${{ env.SNAP_CORES }}
          microceph-channel: ${{ env.MICROCEPH_SNAP_CHANNEL }}
          microovn-channel: ${{ env.MICROOVN_SNAP_CHANNEL }}
          microovn-core: ${{ env.MICROOVN_SNAP_CORE }}

      - name: Tmate debugging session
        if: ${{ failure() && inputs.tmate-debug }}
        timeout-minutes: 30
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          # Never allow public SSH access
          limit-access-to-actor: true
