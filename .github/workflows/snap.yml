name: Snap channel tests

on:
  schedule:
    - cron: '38 6 * * *'
  workflow_dispatch:
    inputs:
      snap-track:
        description: Snap track to test.
        type: choice
        default: 'latest'
        options:
          - 'latest'
          - '6'
          - '5.21'
          - '5.0'
          - '4.0'
      snap-risk:
        description: Snap risk level, `edge`, `candidate` or `stable`.
        type: choice
        default: 'edge'
        options:
          - 'edge'
          - 'candidate'
          - 'stable'
      ubuntu-releases:
        description: Ubuntu releases to run the tests against. In JSON format, i.e. '["24.04", "26.04"]'.
        type: choice
        default: '["26.04"]'
        options:
          - '["22.04"]'
          - '["24.04"]'
          - '["26.04"]'
          - '["24.04", "26.04"]'
      tmate-debug:
        description: Use tmate debugging session on integration test failure.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.snap-track }}-${{ inputs.snap-risk }}-${{ inputs.ubuntu-releases }}
  # XXX: scheduled runs should not cancel manually triggered ones
  cancel-in-progress: ${{ !contains(github.event_name, 'schedule')}}

defaults:
  run:
    # Make sure bash is always invoked with `-eo pipefail`
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell
    shell: bash

env:
  IMAGE_CACHE_DIR: "/home/runner/image-cache"
  SNAP_CACHE_DIR: "/home/runner/snap-cache"
  # XXX: avoid Ceph 20.2.4 due to new authentication for CVE-2025-30156 not compatible with the ceph-common version shipped in the LXD snap
  # Revert to latest/edge once https://bugs.launchpad.net/ubuntu/+source/ceph/+bug/2166817 is fixed and propagated in the LXD snap
  MICROCEPH_SNAP_CHANNEL: "tentacle/stable"

jobs:
  # Prime the images/snaps caches once so the (potentially large) snap-tests
  # matrix below doesn't stampede on cache misses.
  prime-caches:
    if: ${{ github.event_name != 'schedule' || github.repository == 'canonical/lxd' }}
    name: Prime caches
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prime cache with external test images
        uses: $/.github/actions/download-images
        with:
          prime-cache-only: true
          image-cache-dir: ${{ env.IMAGE_CACHE_DIR }}

      - name: Prime cache with snap dependencies
        uses: $/.github/actions/download-snaps
        with:
          prime-cache-only: true
          snap-cache-dir: ${{ env.SNAP_CACHE_DIR }}
          cache-key-suffix: ${{ github.run_id }}
          microceph-channel: ${{ env.MICROCEPH_SNAP_CHANNEL }}

  snap-tests:
    if: ${{ github.event_name != 'schedule' || github.repository == 'canonical/lxd' }}
    needs: prime-caches
    name: ${{ matrix.test }} (${{ matrix.track }}/${{ matrix.risk }} - ${{ matrix.os }})
    runs-on: ubuntu-${{ matrix.os }}
    # avoid runaway test burning 6 hours of CI
    timeout-minutes: 60
    permissions:
      actions: write  # to save caches (only runs from the canonical repo, not fork PRs)
      contents: read  # for private repos or higher API rate limits
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.ubuntu-releases || (github.event_name == 'schedule' && '["22.04", "24.04", "26.04"]') || '["26.04"]') }}
        track: ${{ fromJSON(inputs.snap-track && format('["{0}"]', inputs.snap-track) || (github.event_name == 'schedule' && '["6", "5.21", "5.0"]') || '["latest"]') }}
        risk:
          - ${{ inputs.snap-risk || 'edge' }}
        test:
          - bgp
          - cgroup
          - cloud-init
          - cluster
          - container
          - container-copy
          - conversion
          - cpu-vm
          - csi
          - devlxd
          - docker
          - efi-vm
          - lxd-consumers
          - lxd-installer
          - lxd-user
          - interception
          - nesting
          - network-bridge-firewall
          - network-ovn ovn:deb
          - network-ovn ovn:latest/edge
          - network-routed
          - qemu-external-vm
          - snapd
          - storage-buckets
          - storage-disks-vm
          - storage-metadata
          - storage-vm btrfs
          - storage-vm ceph
          - storage-vm dir
          - storage-vm lvm
          - storage-vm lvm-thin
          - storage-vm zfs
          - storage-volumes-vm
          - tpm-vm
          - ui chromium
          - ui firefox
          - vm
          - vm-migration
        exclude:
          # csi is not compatible with 4.0/*, 5.0/* or 5.21/*, nor with 22.04
          - track: "4.0"
            test: csi
          - track: "5.0"
            test: csi
          - track: "5.21"
            test: csi
          - os: 22.04
            test: csi
          # not compatible with 4.0/*
          - track: "4.0"
            test: bgp
          - track: "4.0"
            test: cloud-init
          - track: "4.0"
            test: container-copy
          - track: "4.0"
            test: conversion
          - track: "4.0"
            test: cpu-vm
          - track: "4.0"
            test: docker
          - track: "4.0"
            test: lxd-installer
          - track: "4.0"
            test: lxd-user
          - track: "4.0"
            test: network-ovn ovn:deb
          - track: "4.0"
            test: network-ovn ovn:latest/edge
          - track: "4.0"
            test: qemu-external-vm
          - track: "4.0"
            test: storage-buckets
          - track: "4.0"
            test: storage-disks-vm
          - track: "4.0"
            test: storage-metadata
          - track: "4.0"
            test: storage-vm btrfs
          - track: "4.0"
            test: storage-vm ceph
          - track: "4.0"
            test: storage-vm dir
          - track: "4.0"
            test: storage-vm lvm
          - track: "4.0"
            test: storage-vm lvm-thin
          - track: "4.0"
            test: storage-vm zfs
          - track: "4.0"
            test: storage-volumes-vm
          - track: "4.0"
            test: tpm-vm
          - track: "4.0"
            test: ui chromium
          - track: "4.0"
            test: ui firefox
          - track: "4.0"
            test: vm-migration
          # not compatible with 5.0/*
          - track: "5.0"
            test: cloud-init
          - track: "5.0"
            test: docker
          - track: "5.0"
            test: lxd-installer
          - track: "5.0"
            test: network-ovn ovn:latest/edge
          - track: "5.0"
            test: qemu-external-vm
          - track: "5.0"
            test: vm-migration
          # not compatible with 5.21/*
          - track: "5.21"
            test: lxd-installer
          - track: "5.21"
            test: qemu-external-vm
          # some tests are not worth testing on specific OSes
          - os: 22.04
            test: bgp
          - os: 22.04
            test: lxd-installer
          - os: 22.04
            test: qemu-external-vm
          # skip track/os combinations that are too far apart
          - os: 22.04
            track: "latest"
          - os: 22.04
            track: "6"
          - os: 24.04
            track: "4.0"
          - os: 24.04
            track: "5.0"
          - os: 26.04
            track: "4.0"
          - os: 26.04
            track: "5.0"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tune disk performance
        uses: $/.github/actions/tune-disk-performance

      - name: Reclaim some memory
        uses: $/.github/actions/reclaim-memory

      - name: Remove docker
        uses: $/.github/actions/disable-docker

      - name: ${{ matrix.test }}
        uses: $/.github/actions/snap-test
        with:
          test: ${{ matrix.test }}
          channel: ${{ matrix.track }}/${{ matrix.risk }}
          os: ${{ matrix.os }}
          image-cache-dir: ${{ env.IMAGE_CACHE_DIR }}
          snap-cache-dir: ${{ env.SNAP_CACHE_DIR }}
          snap-cache-key-suffix: ${{ github.run_id }}
          microceph-channel: ${{ env.MICROCEPH_SNAP_CHANNEL }}

      - name: Tmate debugging session
        if: ${{ failure() && inputs.tmate-debug }}
        timeout-minutes: 30
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          # Never allow public SSH access
          limit-access-to-actor: true
