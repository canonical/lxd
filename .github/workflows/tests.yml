name: Tests
on:
  push:
    branches:
      - main
      - stable-*
      - release-*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    # Make sure bash is always invoked with `-eo pipefail`
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell
    shell: bash

jobs:
  code-tests:
    name: Code
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A non-shallow clone is needed for the Differential ShellCheck
          fetch-depth: 0
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: github.event_name == 'pull_request' && github.repository == 'canonical/lxd'

      # XXX: `make static-analysis` also run shellcheck but this one provides
      #      useful feedback in the PR through github-code-scanning bot
      - id: ShellCheck
        name: Differential ShellCheck
        uses: redhat-plumbers-in-action/differential-shellcheck@f51c7c0d32777d00de777131d25918617a246415 # v5.5.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          strict-check-on-push: true
        if: github.event_name == 'pull_request' && github.repository == 'canonical/lxd'

      - name: Upload artifact with ShellCheck defects in SARIF format
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Differential ShellCheck SARIF
          path: ${{ steps.ShellCheck.outputs.sarif }}
        if: github.event_name == 'pull_request' && github.repository == 'canonical/lxd'

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install build dependencies
        uses: $/.github/actions/install-lxd-builddeps

      - name: Install Python dependencies
        run: python3 -m pip install flake8

      - name: Download go dependencies
        run: |
          set -eux
          go mod download

      - name: Make LXD tarball and unpack it
        env:
          CUSTOM_VERSION: "test"
        run: |
          set -eux
          make dist
          tar -xzf lxd-test.tar.gz -C "${GITHUB_WORKSPACE}/.."
          rm lxd-test.tar.gz

      - name: Build or restore dqlite/liblxc dependencies
        uses: $/.github/actions/cache-dqlite-liblxc
        with:
          export-env: true

      - name: Run LXD build
        run: |
          set -eux
          make

      - name: Check lxc/lxd-agent binary sizes
        run: |
          set -eux

          # Build lxc/lxd-agent the same way as done in the snap
          go build -trimpath -o "/tmp/bin/lxc" github.com/canonical/lxd/lxc
          CGO_ENABLED=0 go build -trimpath -o "/tmp/bin/lxd-agent" -tags=agent,netgo github.com/canonical/lxd/lxd-agent
          strip -s /tmp/bin/*

          # bin/min/max (sizes are in MiB)
          SIZES="lxc 16 18
                 lxd-agent 15 17"
          MIB="$((1024 * 1024))"

          while read -r bin min max; do
            cur="$(stat --format=%s "/tmp/bin/${bin}")"
            min_mib="$((min * MIB))"
            max_mib="$((max * MIB))"
            rm -f "/tmp/bin/${bin}"

            if [ "${cur}" -gt "${max_mib}" ]; then
              echo "FAIL: ${bin} binary size exceeds ${max}MiB"
              exit 1
            fi

            # XXX: check for when we need to lower the min/max sizes
            if [ "${cur}" -lt "${min_mib}" ]; then
              echo "Congratulations: ${bin} binary size reduced below ${min}MiB"
              echo "It is now time to edit the workflow job to use smaller min/max sizes for ${bin}"
              exit 1
            fi

            echo "OK: ${bin} is between ${min} and ${max}MiB"
          done <<< ${SIZES}

      - name: Run static analysis
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
        run: |
          set -eux
          make static-analysis

      - name: Unit tests (all)
        run: |
          set -eux
          sudo apt-get install -y xdelta3 # Required for SimpleStreams client tests.
          sudo --preserve-env=CGO_CFLAGS,CGO_LDFLAGS,CGO_LDFLAGS_ALLOW,LD_LIBRARY_PATH,LD_RUN_PATH,PKG_CONFIG_PATH LD_LIBRARY_PATH=${LD_LIBRARY_PATH} env "PATH=${PATH}" go test -v ./...

      - name: Upload system test dependencies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-test-deps
          path: |
            /home/runner/go/bin/lxc
            /home/runner/go/bin/lxc-to-lxd
            /home/runner/go/bin/lxd
            /home/runner/go/bin/lxd-agent
            /home/runner/go/bin/lxd-benchmark
            /home/runner/go/bin/lxd-migrate
            /home/runner/go/bin/lxd-user
          retention-days: 1

      - name: Upload system test C dependencies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-test-c-deps
          path: |
            /home/runner/go/deps/dqlite
            /home/runner/go/deps/liblxc
          retention-days: 1

  system-tests:
    env:
      CGO_LDFLAGS_ALLOW: "(-Wl,-wrap,pthread_create)|(-Wl,-z,now)"
      LXD_SHIFTFS_DISABLE: "true"
      LXD_CEPH_CLUSTER: "ceph"
      LXD_CEPH_CEPHFS: "cephfs"
      LXD_CONCURRENT: "1"
      LXD_VERBOSE: "1"
      LXD_OFFLINE: "1"
      LXD_TMPFS: "1"
    name: System
    runs-on: ubuntu-22.04
    needs: code-tests
    strategy:
      fail-fast: false
      matrix:
        suite: ["cluster", "standalone"]
        backend: ["dir", "btrfs", "lvm", "zfs", "ceph", "random"]

    steps:
      - name: Performance tuning
        run: |
          set -eux
          # optimize ext4 FSes for performance, not reliability
          for fs in $(findmnt --noheading --type ext4 --list --uniq | awk '{print $1}'); do
            # nombcache and data=writeback cannot be changed on remount
            sudo mount -o remount,noatime,barrier=0,commit=6000 "${fs}" || true
          done

          # disable dpkg from calling sync()
          echo "force-unsafe-io" | sudo tee /etc/dpkg/dpkg.cfg.d/force-unsafe-io

      - name: Reclaim some space
        run: |
          set -eux

          sudo snap remove lxd --purge
          # Purge older snap revisions that are disabled/superseded by newer revisions of the same snap
          snap list --all | while read -r name _ rev _ _ notes _; do
            [[ "${notes}" =~ disabled$ ]] && snap remove "${name}" --revision "${rev}" --purge
          done || true

          # This was inspired from https://github.com/easimon/maximize-build-space
          df -h /
          # dotnet
          sudo rm -rf /usr/share/dotnet
          # android
          sudo rm -rf /usr/local/lib/android
          # haskell
          sudo rm -rf /opt/ghc
          df -h /

      - name: Remove docker
        run: |
          set -eux
          sudo apt-get autopurge -y moby-containerd docker uidmap
          sudo ip link delete docker0
          sudo nft flush ruleset

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Check compatibility with min Go version
        run: |
          set -eux
          GOMIN="$(sed -n 's/^GOMIN=\([0-9.]\+\)$/\1/p' Makefile)"
          go mod tidy -go="${GOMIN}"

          DOC_GOMIN="$(sed -n 's/^LXD requires Go \([0-9.]\+\) .*/\1/p' doc/requirements.md)"
          [ "${GOMIN}" = "${DOC_GOMIN}" ]

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update

          sudo systemctl mask lxc.service lxc-net.service

          sudo apt-get install --no-install-recommends -y \
            curl \
            git \
            libacl1-dev \
            libcap-dev \
            libdbus-1-dev \
            libseccomp-dev \
            libselinux-dev \
            libsqlite3-dev \
            libtool \
            libudev-dev \
            make \
            pkg-config\
            acl \
            attr \
            bind9-dnsutils \
            btrfs-progs \
            busybox-static \
            dnsmasq-base \
            easy-rsa \
            gettext \
            jq \
            lxc-utils \
            lvm2 \
            nftables \
            quota \
            rsync \
            s3cmd \
            socat \
            sqlite3 \
            squashfs-tools \
            tar \
            tcl \
            thin-provisioning-tools \
            uuid-runtime \
            xfsprogs \
            xz-utils \
            zfsutils-linux

          # reclaim some space
          sudo apt-get clean

          mkdir -p "$(go env GOPATH)/bin"

      - name: Download go dependencies
        run: |
          set -eux
          go mod download

      - name: Download system test C dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: system-test-c-deps
          path: /home/runner/go/deps

      - name: Build or restore dqlite/liblxc dependencies
        uses: $/.github/actions/cache-dqlite-liblxc
        with:
          export-env: true

      - name: Download system test dependencies
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: system-test-deps
          merge-multiple: true
          path: /home/runner/go/bin

      - name: Set exec perms on LXD binaries
        run: |
          set -eux
          ls -lR /home/runner/go/bin/
          chmod uog+x /home/runner/go/bin/*

      - name: Setup MicroCeph
        if: ${{ matrix.backend == 'ceph' }}
        uses: $/.github/actions/setup-microceph
        with:
          osd-count: 3
          microceph-channel: "squid/edge"

      - name: "Run system tests (${{ matrix.suite }}, ${{ matrix.backend }})"
        run: |
          echo '|/bin/sh -c $@ -- eval exec gzip --fast > /var/crash/core-%e.%p.gz' | sudo tee /proc/sys/kernel/core_pattern
          set -eux
          chmod +x ~
          echo "root:1000000:1000000000" | sudo tee /etc/subuid /etc/subgid
          cd test
          export PATH="/home/runner/go/bin:$PATH"
          sudo --preserve-env=PATH,GOPATH,GITHUB_ACTIONS,LXD_VERBOSE,LXD_BACKEND,LXD_CEPH_CLUSTER,LXD_CEPH_CEPHFS,LXD_CEPH_CEPHOBJECT_RADOSGW,LXD_OFFLINE,LXD_SKIP_TESTS,LXD_REQUIRED_TESTS,LXD_SHIFTFS_DISABLE,CGO_CFLAGS,CGO_LDFLAGS,CGO_LDFLAGS_ALLOW,LD_LIBRARY_PATH,LD_RUN_PATH,PKG_CONFIG_PATH LXD_BACKEND=${{ matrix.backend }} ./main.sh ${{ matrix.suite }}

  client:
    name: Client
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    needs: code-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Create build directory
        run: |
            mkdir bin

      - name: Build static lxc (x86_64)
        env:
          CGO_ENABLED: 0
          GOARCH: amd64
        run: |
          go build -ldflags "-s -w" -o trimpath -o bin/lxc.x86_64 ./lxc

      - name: Build static lxc (aarch64)
        env:
          CGO_ENABLED: 0
          GOARCH: arm64
        run: |
          go build -ldflags "-s -w" -o trimpath -o bin/lxc.aarch64 ./lxc

      - name: Build static lxd-benchmark
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: 0
        run: |
          set -eux
          GOARCH=amd64 go build -ldflags "-s -w" -o trimpath -o bin/lxd-benchmark.x86_64 ./lxd-benchmark
          GOARCH=arm64 go build -ldflags "-s -w" -o trimpath -o bin/lxd-benchmark.aarch64 ./lxd-benchmark

      - name: Build static lxd-migrate
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: 0
        run: |
          set -eux
          GOARCH=amd64 go build -ldflags "-s -w" -o trimpath -o bin/lxd-migrate.x86_64 ./lxd-migrate
          GOARCH=arm64 go build -ldflags "-s -w" -o trimpath -o bin/lxd-migrate.aarch64 ./lxd-migrate

      - name: Unit tests (client)
        env:
          CGO_ENABLED: 0
        run: |
          set -eux
          if [ "${{ runner.os }}" = "Linux" ]; then
            # Required for SimpleStreams client tests.
            sudo apt-get install -y xdelta3
          fi
          go test -v ./client/...

      - name: Unit tests (lxc)
        env:
          CGO_ENABLED: 0
        run: go test -v ./lxc/...

      - name: Unit tests (shared)
        env:
          CGO_ENABLED: 0
        run: go test -v ./shared/...

      - name: Upload lxc client artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: ${{ runner.os }}
          path: bin/

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    needs: code-tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A non-shallow clone is needed for the sitemap generation
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get install aspell aspell-en
          sudo snap install mdl

      - name: Run markdown linter
        run: |
          set -eux
          make doc-lint

      - name: Run spell checker
        run: |
          set -eux
          make doc-spellcheck

      - name: Run inclusive naming checker
        uses: get-woke/woke-action@b2ec032c4a2c912142b38a6a453ad62017813ed0 # v0
        with:
          fail-on-error: true
          woke-args: "*.md **/*.md -c https://github.com/canonical/Inclusive-naming/raw/main/config.yml"

      - name: Run link checker
        if: ${{ github.repository == 'canonical/lxd' }}
        run: |
          set -eux
          make doc-linkcheck

      - name: Build docs (Sphinx)
        run: |
          set -eux
          make doc
          if [ -s doc/.sphinx/warnings.txt ]; then cat doc/.sphinx/warnings.txt; exit 1; fi

      - name: Upload documentation artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: doc/html

  lxd-migrate:
    name: Test lxd-migrate build
    runs-on: ubuntu-22.04
    needs: code-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Test lxd-migrate build
        run: |
          set -eux
          cd "${GITHUB_WORKSPACE}/lxd-migrate"
          CGO_ENABLED=0 go build -v -tags netgo

  snap:
    name: Trigger snap build
    runs-on: ubuntu-24.04
    needs: [code-tests, system-tests, client, documentation]
    if: ${{ github.repository == 'canonical/lxd' && github.event_name == 'push' && github.actor != 'dependabot[bot]' }}
    env:
      SSH_AUTH_SOCK: /tmp/ssh_agent.sock
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A non-shallow clone is needed for the rebase with the lxd-private branch
          fetch-depth: 0
          persist-credentials: false

      # XXX: from this point onwards in this **specific job**, the private SSH key is
      #      available through the SSH_AUTH_SOCK environment variable.
      - uses: $/.github/actions/lp-snap-build
        with:
          repo: "git+ssh://lxdbot@git.launchpad.net/~lxd-snap/lxd"
          ssh-key: "${{ secrets.LAUNCHPAD_LXD_BOT_KEY}}" # zizmor: ignore[secrets-outside-env]

      - name: Trigger Launchpad snap build
        run: |
          set -eux
          set -o pipefail

          # Always unload the SSH key from the agent on exit to prevent accidental
          # usage in any subsequent steps within this job.
          trap 'ssh-add -D || true' EXIT

          # Record the public commit hash before snapcraft.yaml is modified for the private build.
          localRev="$(git rev-parse "origin/${GITHUB_REF_NAME}")"

          # Add the private LXD repository and rebase to incorporate private security fixes.
          git remote add lxd-private git@github.com:canonical/lxd-private.git
          git fetch lxd-private "${GITHUB_REF_NAME}"
          git checkout --quiet -B "lxd-private-${GITHUB_REF_NAME}" "lxd-private/${GITHUB_REF_NAME}"
          git rebase --quiet --no-stat "origin/${GITHUB_REF_NAME}"

          # Sync the rebased lxd-private branch back to the lxd-private repo so that it is kept in sync with the public repo.
          # Do this before any snapcraft.yaml modifications made below.
          git push --quiet --force lxd-private HEAD:"${GITHUB_REF_NAME}"

          # Extract a strict major.minor[.patch] version from shared/version/flex.go.
          version="$(sed -nE 's/^var Version = "([0-9]+\.[0-9]+(\.[0-9]+)?)"$/\1/p' "${GITHUB_WORKSPACE}/shared/version/flex.go")"

          if [ -z "${version}" ]; then
            echo "ERROR: Invalid version format in shared/version/flex.go. Expected format: n.n or n.n.n" >&2
            exit 1
          fi

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            BRANCH="latest-edge"
          elif [[ "${GITHUB_REF_NAME}" =~ ^stable- ]]; then
            BRANCH="${GITHUB_REF_NAME#stable-}-edge"
          elif [[ "${GITHUB_REF_NAME}" =~ ^release-6\. ]]; then
            BRANCH="6-candidate"
          elif [[ "${GITHUB_REF_NAME}" =~ ^release-([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            BRANCH="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}-candidate"
          else
            echo "ERROR: Unsupported GITHUB_REF_NAME pattern: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          # Determine snap version and grade based on edge or candidate.
          grade="devel"
          if [[ "${BRANCH}" == *"-candidate" ]]; then
            versionString="${version}-${localRev:0:7}"
            grade="stable"
          else
            versionString="git-${localRev:0:7}"
          fi

          cd "${GITHUB_WORKSPACE}/snap"

          # Fail unless exactly one `version: git` line exists, then replace it.
          match_count="$(grep -cxF 'version: git' snapcraft.yaml || true)"
          if [ "${match_count}" -ne 1 ]; then
            echo "ERROR: Expected exactly one 'version: git' line in snapcraft.yaml, found ${match_count}" >&2
            exit 1
          fi

          sed -i -e "s/^version: git$/version: ${versionString}/" snapcraft.yaml

          if [ "${grade}" = "stable" ]; then
            # Fail unless exactly one `grade: devel` line exists, then replace it.
            match_count="$(grep -cxF 'grade: devel' snapcraft.yaml || true)"
            if [ "${match_count}" -ne 1 ]; then
              echo "ERROR: Expected exactly one 'grade: devel' line in snapcraft.yaml, found ${match_count}" >&2
              exit 1
            fi

            sed -i -e "s/^grade: devel$/grade: stable/" snapcraft.yaml
          fi

          git add snapcraft.yaml
          git commit --quiet -s -m "Automatic upstream build (${BRANCH})" -m "Upstream commit: ${localRev} (version: ${versionString})"
          git show

          # Fetch the current Launchpad tip (falling back to latest-edge when creating a new
          # branch) into a remote-tracking ref so `git push` knows what objects Launchpad
          # already has instead of re-uploading the entire repository.
          if ! fetch_err="$(LC_ALL=C git fetch --quiet --no-tags launchpad "+refs/heads/${BRANCH}:refs/remotes/launchpad/${BRANCH}" 2>&1)"; then
            printf '%s\n' "${fetch_err}" >&2
            if [[ "${fetch_err}" == *"couldn't find remote ref"* ]] && [ "${BRANCH}" != "latest-edge" ]; then
              git fetch --quiet --no-tags launchpad "+refs/heads/latest-edge:refs/remotes/launchpad/latest-edge"
            else
              exit 1
            fi
          fi

          git push --no-follow-tags --quiet --force launchpad HEAD:"${BRANCH}"
