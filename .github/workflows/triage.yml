name: Triaging
on:
  # pull_request_target is needed so that actions/labeler can write labels on PRs
  # from forks (pull_request lacks write access in that case). dangerous-triggers
  # does not apply: neither this workflow nor the workflows it calls check out PR code.
  pull_request_target: # zizmor: ignore[dangerous-triggers]

permissions: {}

jobs:
  label:
    if: ${{ github.repository == 'canonical/lxd' }}
    permissions:
      contents: read  # for actions/labeler to determine modified files
      pull-requests: write  # for actions/labeler to add labels to PRs
    name: PR labels
    runs-on: ubuntu-slim
    steps:
      # Additive only: syncing would strip domain labels that maintainers set by hand.
      - name: Domain labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: false

      - name: Branch labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
          configuration-path: '.github/labeller-branches.yml'

      - name: Label backports (main target, non-dependabot)
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        if: ${{ github.base_ref == 'main' && github.actor != 'dependabot[bot]' }}
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
          configuration-path: '.github/labeller-backports.yml'

  # Run after the labeler: labels it adds with GITHUB_TOKEN fire no events for other workflows.
  domain-label:
    needs: label
    permissions:
      contents: read
      pull-requests: write
    uses: $/.github/workflows/domain-label.yml

  domain-reviewers:
    needs: label
    permissions:
      contents: read
      pull-requests: write
    uses: $/.github/workflows/domain-reviewers.yml
